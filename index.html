<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Garita LP">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>Loss Prevention · Control de Acceso Garita</title>
<style>
:root{
  --bg:#0e1013; --panel:#161a20; --panel2:#1c2129; --line:#2a303b; --text:#ece9e2; --muted:#98a0ad;
  --gold:#c9a961; --gold2:#e3cd96; --ok:#5fbf8f; --warn:#e5a04a; --bad:#e26d6d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#12151a,#0c0e11);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{text-align:center;padding:4px 6px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.logo{height:64px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.logo img{max-height:64px;max-width:190px;object-fit:contain}
.mono{width:58px;height:58px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;color:var(--gold2);font-size:20px;letter-spacing:.06em;box-shadow:0 0 0 4px rgba(201,169,97,.08)}
.brand h1{font:600 15px Georgia,"Times New Roman",serif;letter-spacing:.32em;margin:0;color:var(--text)}
.brand p{margin:6px 0 0;font-size:11px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--muted);border:1px solid transparent;transition:.15s}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{color:var(--text);background:#1a1f27}
.nav button.on{color:var(--gold2);background:linear-gradient(90deg,rgba(201,169,97,.16),rgba(201,169,97,.04));border-color:rgba(201,169,97,.35)}
.nav .badge{margin-left:auto;background:var(--gold);color:#16120a;font-weight:700;font-size:11px;border-radius:20px;padding:1px 8px}
.side .foot{margin-top:auto;font-size:11px;color:var(--muted);text-align:center;letter-spacing:.12em;text-transform:uppercase;border-top:1px solid var(--line);padding-top:14px}
.content{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--line);background:rgba(14,16,19,.85);position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
.top .t{font:600 17px Georgia,serif;letter-spacing:.04em}
.top .t small{display:block;font:400 12px "Segoe UI",sans-serif;color:var(--muted);letter-spacing:.02em}
.top .r{text-align:right;font-size:12px;color:var(--muted)}
.top .r b{display:block;color:var(--text);font-size:15px;font-weight:600}
main{padding:24px 28px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0 0 14px;font:600 13px "Segoe UI",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.grid2{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
.fields{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 2}
.f.s3{grid-column:span 3}.f.s4{grid-column:span 4}.f.s6{grid-column:span 6}
label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
label i{color:var(--gold);font-style:normal}
input,select,textarea{background:#10131a;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font:inherit;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,97,.14)}
textarea{resize:vertical;min-height:62px}
select option{background:#10131a}
.btn{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:600;transition:.15s}
.btn:hover{border-color:#3a4252;background:#222834}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#18130a;border-color:var(--gold)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.big{padding:14px 22px;font-size:15px}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pbox{position:relative;aspect-ratio:4/3;background:#0b0d10 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='38' r='16' fill='%232a303b'/><path d='M18 90c3-22 17-32 32-32s29 10 32 32z' fill='%232a303b'/></svg>") center/46% no-repeat;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pbox video,.pbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pbox img{display:none}.pbox video{display:none}
.pmsg{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;font-size:12px;color:var(--muted);background:linear-gradient(0deg,rgba(0,0,0,.65),transparent);text-align:center}
.info{min-height:20px;font-size:12.5px;margin-top:6px}
.info .warn{color:var(--warn);display:block}.info .ok{color:var(--ok);display:block}
.info a{color:var(--gold2);cursor:pointer;text-decoration:underline}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid #20252e;vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#1b2028}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#10131a;border:1px solid var(--line);display:block}
.nophoto{width:44px;height:44px;border-radius:8px;background:#10131a;border:1px dashed var(--line)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;border:1px solid var(--line);color:var(--muted)}
.tag.in{color:var(--ok);border-color:rgba(95,191,143,.5)}
.muted{color:var(--muted)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.filters{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-bottom:16px}
.filters .f{grid-column:span 3}.filters .f.s2{grid-column:span 2}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font:600 26px Georgia,serif;color:var(--gold2)}
.stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pagehead{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}
.pagehead h2{margin:0;font:600 22px Georgia,serif}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(5,6,8,.72);display:grid;place-items:center;z-index:50;padding:20px}
.modal.hidden{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.mgrid{display:grid;grid-template-columns:280px 1fr;gap:20px}
.mgrid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#0b0d10}
.dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:0}
.dl dt{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}.dl dd{margin:0}
#toast{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:#1d2229;border:1px solid var(--gold);color:var(--text);padding:11px 16px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.print-head{display:none}
@media (max-width:1100px){.app{grid-template-columns:200px 1fr}.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@page{size:landscape;margin:12mm}
@media print{
  body{background:#fff;color:#000}
  .side,.top,.no-print,.filters,.btn{display:none!important}
  .app{display:block}main{padding:0}
  .card{background:#fff;border:none;padding:0}
  .print-head{display:block;margin-bottom:10px}
  .print-head h1{font:700 18px Georgia,serif;margin:0}.print-head p{margin:2px 0;color:#444;font-size:12px}
  .stat{background:#fff;border-color:#bbb}.stat b{color:#000}.stat span{color:#444}
  .tbl th{color:#333;border-bottom:1px solid #888}.tbl td{border-bottom:1px solid #ddd;color:#000}
  .tbl{font-size:11px}.thumb{width:34px;height:34px}.tag{color:#000;border-color:#999}
}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{all:unset;cursor:pointer;padding:9px 16px;border-radius:10px;border:1px solid var(--line);color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.tabs button:hover{color:var(--text);background:#1a1f27}
.tabs button.on{color:var(--gold2);border-color:rgba(201,169,97,.5);background:linear-gradient(90deg,rgba(201,169,97,.16),rgba(201,169,97,.04))}
.tabs .n{background:#232a34;border-radius:20px;padding:0 8px;font-size:11px;color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{all:unset;cursor:pointer;padding:5px 12px;border-radius:20px;border:1px solid var(--line);color:var(--muted);font-size:12px}
.chip.on{color:#18130a;background:var(--gold);border-color:var(--gold);font-weight:700}
.hint{color:var(--muted);font-size:12.5px;margin:2px 0 12px}
.hint b{color:var(--gold2)}
.pt{width:100%;border-collapse:collapse}
.pt th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:58px;background:var(--panel);z-index:2}
.pt td{white-space:nowrap;padding:7px 10px;border-bottom:1px solid #20252e;vertical-align:middle}
.pt tbody tr{cursor:pointer;user-select:none}
.pt tbody tr:hover{background:#1b2028}
.pt tbody tr.flash{animation:fl 1.4s}
@keyframes fl{0%{background:rgba(95,191,143,.35)}100%{background:transparent}}
.pt tr.dentro td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.ph{width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:#10131a;display:grid;place-items:center;color:var(--muted);cursor:pointer;font-size:0}
.ph svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.tag.warn{color:var(--warn);border-color:rgba(229,160,74,.5)}.tag.bad{color:var(--bad);border-color:rgba(226,109,109,.55)}.tag.cita{color:var(--gold2);border-color:rgba(201,169,97,.5)}
.evcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:22px;position:relative;overflow:hidden}
.evcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--evc,var(--gold))}
.evhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.evlogo{width:92px;height:92px;border-radius:16px;background:#0f1216;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.evlogo img{max-width:100%;max-height:100%;object-fit:contain}
.evlogo .mk{font:700 26px Georgia,serif;color:var(--evc,var(--gold));letter-spacing:.04em}
.evhead h3{margin:0;font:600 22px Georgia,serif;letter-spacing:0;text-transform:none;color:var(--text)}
.evhead .sub{color:var(--muted);margin-top:2px}
.evkpi{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.evkpi div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-align:center;min-width:92px}
.evkpi b{display:block;font:600 22px Georgia,serif;color:var(--gold2)}.evkpi span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.evinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:16px 0}
.evinfo div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.evinfo small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.tl{position:relative;margin-top:8px;overflow-x:auto}
.tlin{min-width:900px;position:relative}
.tlax{display:grid;grid-template-columns:170px 1fr;border-bottom:1px solid var(--line)}
.tlax .hrs{position:relative;height:24px}
.tlax .hrs span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted);top:4px}
.tlrow{display:grid;grid-template-columns:170px 1fr;border-bottom:1px solid #20252e}
.tlrow .lb{padding:8px 10px 8px 0;font-size:12px;color:var(--muted);display:flex;align-items:center}
.tlrow .lane{position:relative;background-image:linear-gradient(90deg,#20252e 1px,transparent 1px);background-size:calc(100%/17) 100%}
.bar{position:absolute;height:24px;border-radius:7px;font-size:11px;font-weight:600;color:#10131a;padding:0 7px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 6px rgba(0,0,0,.4);cursor:default}
.bar.coffee{background:#c9a961}.bar.almuerzo{background:#5fbf8f}.bar.reunion{background:#6aa6e0}.bar.cocktail{background:#d98bb1}.bar.staff{background:#98a0ad}.bar.oficina{background:#8f84d6}.bar.otro{background:#d0c9b8}
.nowl{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:3}
.nowl:after{content:"ahora";position:absolute;top:-2px;left:4px;font-size:10px;color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:12px 0 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
body.printcard .side,body.printcard .top,body.printcard main,body.printcard #toast{display:none!important}
@media print{body.printcard .modal{position:static;background:#fff;padding:0;display:block}body.printcard .mbox{background:#fff;color:#000;border:none;max-height:none;max-width:none!important}body.printcard .dl dt,body.printcard .muted{color:#444}body.printcard h3{color:#000!important}}
.blab{position:absolute;height:24px;display:flex;align-items:center;font-size:11px;color:var(--muted);white-space:nowrap;pointer-events:auto}
@media print{.tabs,.hint{display:none}}

.side{background:linear-gradient(180deg,rgba(18,21,26,.97),rgba(10,12,15,.97))}
.top{background:rgba(14,16,19,.55)}
.card,.evcard,.mbox{background:rgba(22,26,32,.8);backdrop-filter:blur(10px)}
.stat,.evkpi div,.evinfo div{background:rgba(28,33,41,.7)}
.pt th{background:rgba(20,23,29,.97)}
.pt td{white-space:normal}.pt{table-layout:auto}
.pt tr.dt td{background:rgba(255,255,255,.03);cursor:default;user-select:text;padding:10px 12px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.dgrid small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.kpis,.qas{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.kpi,.qa{all:unset;box-sizing:border-box;cursor:pointer;background:rgba(22,26,32,.62);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px 20px;backdrop-filter:blur(10px);transition:.15s}
.kpi:hover,.qa:hover{border-color:rgba(201,169,97,.6);transform:translateY(-1px)}
.kpi.on{border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,169,97,.4) inset}
.kpi b{display:block;font:600 34px Georgia,serif;color:var(--text)}
.kpi span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.qa{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:112px;justify-content:center}
.qa b{font-size:16px}.qa small{color:var(--muted);font-size:12px}.qa svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5;margin-bottom:4px}
.qa.gold{background:linear-gradient(180deg,#e3cd96,#c9a961);color:#18130a}.qa.gold small{color:#4a3d1c}
.bigq{font-size:17px;padding:14px 16px;border-color:rgba(201,169,97,.5)}
.brand h1{background:linear-gradient(105deg,#c9a961 0%,#c9a961 38%,#fff6d8 50%,#c9a961 62%,#c9a961 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:txs 2s ease-in-out infinite}
@keyframes txs{0%{background-position:0 0}55%,100%{background-position:100% 0}}
@keyframes lgl{0%,100%{filter:drop-shadow(0 0 0 rgba(227,205,150,0))}30%{filter:drop-shadow(0 0 9px rgba(227,205,150,.7))}}
.logo{position:relative}.logo img,.mono{animation:lgl 2s ease-in-out infinite}
.logo.shine::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,246,215,.95) 50%,transparent 62%) 0 0/250% 100% no-repeat;-webkit-mask:var(--lg) center/contain no-repeat;mask:var(--lg) center/contain no-repeat;animation:txs 2s ease-in-out infinite}
@media(max-width:900px){.kpis,.qas{grid-template-columns:1fr}}
@media print{body::before{display:none}.card{backdrop-filter:none}}

/* ===== v4 ===== */
.brand{padding:4px 6px 22px}
.logo{height:130px;margin-bottom:12px}.logo img{max-height:130px;max-width:215px}
.mono{width:96px;height:96px;font-size:34px}
.top{padding:12px 28px}
.top .r{text-align:right}.top .r b{font:600 40px Georgia,serif;letter-spacing:.05em;color:var(--gold2);line-height:1.05;font-variant-numeric:tabular-nums}
.top .r span{font-size:13px}
.kpis,.qas{margin-bottom:20px}.kpi{padding:26px 24px}.kpi b{font-size:44px}.qa{min-height:150px}.qa b{font-size:19px}.qa svg{width:34px;height:34px}

/* ===== v5 ===== */
body.home{--ov:.04;--ov2:.0}
body.home .top{background:rgba(10,9,8,.35)}
.hero{min-height:72vh;display:grid;place-items:center}
.heroBtn{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 78px;border-radius:26px;border:1px solid rgba(227,205,150,.75);background:linear-gradient(180deg,rgba(40,33,18,.72),rgba(14,12,8,.72));backdrop-filter:blur(8px);color:var(--gold2);font:600 30px Georgia,serif;letter-spacing:.28em;text-transform:uppercase;box-shadow:0 10px 50px rgba(0,0,0,.55),0 0 40px rgba(201,169,97,.25);transition:.2s}
.heroBtn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 14px 60px rgba(0,0,0,.6),0 0 60px rgba(227,205,150,.45)}
.heroBtn svg{width:46px;height:46px;stroke:currentColor;fill:none;stroke-width:1.4}
.pbox{aspect-ratio:auto!important;min-height:2.8cm;display:flex;align-items:center;justify-content:center;background-size:38px!important}
.pbox video{position:absolute!important;inset:auto!important;width:2px!important;height:2px!important;opacity:0!important;pointer-events:none}
.pbox img{position:static!important;width:2cm!important;height:2cm!important;border-radius:8px;border:1px solid var(--gold);box-shadow:0 0 14px rgba(0,0,0,.5)}
.pbox.live::before{content:"";position:absolute;top:10px;left:12px;width:16px;height:16px;border-radius:50%;background:#ff2a2a;box-shadow:0 0 14px #ff2a2a;animation:rec 1s ease-in-out infinite}
.pbox.live::after{content:"CÁMARA ENCENDIDA";position:absolute;top:11px;left:36px;font-size:11px;letter-spacing:.14em;color:#ff7b7b}
@keyframes rec{0%,100%{opacity:1}50%{opacity:.12}}
.logo img{width:215px;height:130px;object-fit:contain}

/* ===== v6 ===== */
.ring{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:min(940px,100%);align-items:stretch}
.ring .kpi{padding:18px 20px}.ring .kpi b{font-size:34px}.ring .qa{min-height:118px;padding:14px}
.ring .heroBtn{width:100%;box-sizing:border-box;justify-content:center;padding:18px 10px;font-size:25px;letter-spacing:.2em;border-radius:20px;animation:heroGlow 2.6s ease-in-out infinite}
.ring .heroBtn span{animation:heroTxt 2.6s ease-in-out infinite}
@keyframes heroGlow{0%,100%{border-color:rgba(227,205,150,.5);box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 14px rgba(201,169,97,.2)}50%{border-color:#fff1c4;box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 70px rgba(255,232,160,.7),inset 0 0 26px rgba(255,232,160,.18)}}
@keyframes heroTxt{0%,100%{opacity:.8;text-shadow:none}50%{opacity:1;text-shadow:0 0 16px rgba(255,236,170,.9)}}
@media(max-width:900px){.ring{grid-template-columns:1fr}}
#intro{position:fixed;inset:0;z-index:300;display:grid;place-items:center;overflow:hidden;pointer-events:none;background:radial-gradient(circle,#1b1508 0%,#050403 72%);animation:introBg 1.7s ease-in forwards}
#intro img{width:340px;max-width:60vw;animation:introLogo 1.7s cubic-bezier(.55,0,.25,1) forwards}
@keyframes introBg{0%,55%{opacity:1}100%{opacity:0}}
@keyframes introLogo{0%{transform:scale(.1);opacity:0}28%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:1}100%{transform:scale(18);opacity:0}}
.foot{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center}
.foot small{color:var(--muted);font-size:10.5px;letter-spacing:0;text-transform:none}.foot small.warn{color:#e8b25c}
.camdot{display:none;align-items:center;justify-content:center;gap:8px;font-size:10.5px;letter-spacing:.14em;color:#ff7b7b}
.camdot::before{content:"";width:11px;height:11px;border-radius:50%;background:#ff2a2a;box-shadow:0 0 10px #ff2a2a;animation:rec 1s ease-in-out infinite}

.ring{grid-template-columns:repeat(4,minmax(0,1fr))!important}
.ring .heroBtn{grid-column:span 2}
@media(max-width:900px){.ring{grid-template-columns:1fr!important}.ring>*{grid-column:auto!important}}
#intro{animation-duration:1.25s}
#intro img{animation-duration:1.25s;width:min(520px,70vw)}

.ring .heroBtn{grid-column:2 / span 2}
#intro{background:radial-gradient(circle,rgba(20,16,8,.7),rgba(5,4,3,.5) 70%)!important;animation:introBg2 .9s ease-in forwards!important}
#intro.soft{background:none!important;animation:none!important}
#intro img{width:175px!important;animation:introLogo2 .9s cubic-bezier(.4,0,.2,1) forwards!important}
#intro.soft img{filter:drop-shadow(0 0 16px rgba(227,205,150,.75))}
@keyframes introBg2{0%,55%{opacity:1}100%{opacity:0}}
@keyframes introLogo2{0%{transform:scale(.3);opacity:0}30%{transform:scale(1);opacity:1}55%{transform:scale(1.1);opacity:1}100%{transform:scale(4);opacity:0}}
#idle{position:fixed;inset:0;z-index:400;display:none;place-items:center;background:radial-gradient(circle,#17110a 0%,#030302 75%)}
#idle.on{display:grid;animation:idleIn .8s ease}
#idle svg{filter:drop-shadow(0 0 26px rgba(227,205,150,.5));animation:idleGlow 2.4s ease-in-out infinite}
@keyframes idleIn{from{opacity:0}to{opacity:1}}
@keyframes idleGlow{0%,100%{filter:drop-shadow(0 0 12px rgba(227,205,150,.25))}50%{filter:drop-shadow(0 0 46px rgba(255,236,170,.8))}}
#qs{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:flex-start;padding-top:14vh}
.qbox{width:min(520px,92vw);background:rgba(22,26,32,.97);border:1px solid rgba(201,169,97,.6);border-radius:16px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.qbox input{font-size:18px;padding:12px 14px;width:100%;box-sizing:border-box}
.qr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;margin-top:4px}
.qr small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.qr.on,.qr:hover{background:rgba(201,169,97,.18)}
.qe,.qhint{color:var(--muted);font-size:12px;padding:10px 6px 0}
.pcard{max-width:540px!important}.mgrid{grid-template-columns:130px 1fr!important}.dl{font-size:13px}
.dgrid{grid-template-columns:repeat(auto-fit,minmax(110px,max-content))!important;gap:6px 24px!important}
@media print{.thumb{width:3cm!important;height:3cm!important;object-fit:cover;border-radius:4px}.nophoto{width:3cm;height:3cm}.tbl{font-size:12px}.tbl td{padding:6px 8px}.tbl tr{page-break-inside:avoid}#intro,#idle,#qs{display:none!important}}

/* ===== v13 ===== */
.app{grid-template-columns:284px 1fr}
.side{overflow-y:auto}
.logo{height:176px}.logo img{width:252px!important;height:176px!important;max-width:252px;max-height:176px}
.top .r b{font-size:60px;line-height:1}.top .r span{font-size:14px}
.nav button.sub{padding:8px 12px 8px 30px;font-size:13px}
.nav button.more{opacity:.85;margin-top:4px;border-top:1px dashed var(--line);border-radius:0 0 10px 10px}
#intro.big{background:radial-gradient(circle,rgba(60,44,8,.55),rgba(5,4,3,.35) 70%)!important;animation:introBg3 1.7s ease-out forwards!important}

async function seedData(){
  if(S.cfg.seedV===SEED_V)return;
  const have=new Map(S.people.map(p=>[p.key,p])),byRut=new Map(S.people.filter(p=>p.rut).map(p=>[normDoc(p.rut),p]));
  await dbClear('people');await dbClear('events');
  for(const p of SEED.people){const o=have.get(p.key)||(p.rut&&byRut.get(normDoc(p.rut)));await dbPut('people',{...p,foto:o?(o.foto||null):null})}
  for(const x of SEED.events)await dbPut('events',{...x,activo:true});
  const now=new Date().toISOString();for(const k of ['fijo','banq','pra','evt'])await dbPut('settings',{key:'upd_'+k,value:now});
  await dbPut('settings',{key:'seedV',value:SEED_V});await loadAll();
}

/* ============ marco de la aplicación ============ */
function refreshChrome(){setTimeout(()=>{const im=$('#logoBox img'),b=$('#logoBox');if(im){b.style.setProperty('--lg',`url("${im.src}")`);b.classList.add('shine')}},0);
  {const open=S.navMore||VIEWS_SUB.some(([k])=>k===S.view),b=([k,l],c='')=>`<button data-v="${k}" class="${c}${S.view===k?' on':''}">${ICON[k]}<span>${l}</span>${k==='recinto'?`<span class="badge">${inside().length}</span>`:''}</button>`;
  $('#nav').innerHTML=VIEWS.map(v=>b(v)).join('')+`<button data-more="1" class="more">${ICON.more}<span>Más opciones</span><span style="margin-left:auto">${open?'▴':'▾'}</span></button>`+(open?VIEWS_SUB.map(v=>b(v,'sub')).join(''):'')}
  $('#logoBox').innerHTML=(S.cfg.logo||LOGO_DEF)?`<img src="${S.cfg.logo||LOGO_DEF}" alt="Logo">`:'<div class="mono">S</div>';
}
function clock(){const d=new Date();$('#clockT').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const s=d.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('#clockD').textContent=s.charAt(0).toUpperCase()+s.slice(1)+(S.cfg.operador?' · '+S.cfg.operador:'')}
setInterval(clock,1000);

async function guardarArchivo(){
  const at=new Date().toISOString(),cfg={...S.cfg};delete cfg.snapAt;
  const snap={v:1,savedAt:at,records:S.records,events:S.events,people:S.people,cfg};
  const json=JSON.stringify(snap).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const html='<!DOCTYPE html>\n'+SRC.replace(/<script id="snap" type="application\/json">[\s\S]*?<\/script>/,()=>'<script id="snap" type="application/json">'+json+'<\/script>');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download='Garita_LossPrevention_'+at.slice(0,10)+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  await dbPut('settings',{key:'lastSave',value:at});await dbPut('settings',{key:'snapAt',value:at});await loadAll();S_updateSaveInfo();closeModal();toast('Archivo guardado con historiales y listados');

async function snapImport(){
  let snap=null;try{snap=JSON.parse($('#snap').textContent)}catch{}
  if(!snap||!snap.savedAt||S.cfg.snapAt===snap.savedAt)return;
  const sig=r=>`${r.entrada}|${r.personKey||normDoc(r.doc)||r.nombre}`,have=new Map(S.records.map(r=>[sig(r),r]));let nr=0;
  for(const x of snap.records||[]){const o=have.get(sig(x));if(!o){const {id,...r}=x;await dbPut('records',r);nr++}else if(x.salida&&!o.salida)await dbPut('records',{...o,salida:x.salida,operadorSalida:x.operadorSalida||''})}
  const lp=new Map(S.people.map(p=>[p.key,p]));
  for(const p of snap.people||[]){const o=lp.get(p.key);await dbPut('people',{...p,foto:(o&&o.foto)||p.foto||null})}
  for(const e of snap.events||[]){const o=S.events.find(x=>(e.seedKey&&x.seedKey===e.seedKey)||(x.nombre===e.nombre&&x.fecha===e.fecha));const {id,...ev}=e;await dbPut('events',o?{...ev,id:o.id}:ev)}
  const c=snap.cfg||{};for(const k of ['seedV','lastSave'])if(c[k]&&!S.cfg[k])await dbPut('settings',{key:k,value:c[k]});
  for(const k of Object.keys(c))if(/^upd_/.test(k))await dbPut('settings',{key:k,value:c[k]});
  if(!S.cfg.operador&&c.operador)await dbPut('settings',{key:'operador',value:c.operador});if(!S.cfg.logo&&c.logo)await dbPut('settings',{key:'logo',value:c.logo});
  if(c.blocked){const mine=S.cfg.blocked||[],ids=new Set(mine.map(b=>b.id));await dbPut('settings',{key:'blocked',value:[...mine,...c.blocked.filter(b=>!ids.has(b.id))]})}
  await dbPut('settings',{key:'snapAt',value:snap.savedAt});await loadAll();render();toast(`Datos del archivo cargados (${nr} registros nuevos)`);
}

const Cam={stream:null,err:'',
 stop(){if(IS_MOBILE)this.kill()},kill(){if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null}},
 async attach(video,sel){if(video&&video.isConnected){video.srcObject=this.stream;await video.play().catch(()=>{})}
  try{const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'),cur=this.stream.getVideoTracks()[0].getSettings().deviceId;if(sel){sel.innerHTML=devs.map((d,i)=>`<option value="${esc(d.deviceId)}" ${d.deviceId===cur?'selected':''}>${esc(d.label||'Cámara '+(i+1))}</option>`).join('');sel.style.display=devs.length>1?'block':'none'}}catch{}},
 async start(video,sel,done,deviceId){
  this.err='';if(deviceId&&this.stream)this.kill();
  if(this.stream&&this.stream.active){await this.attach(video,sel);done&&done();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){this.err='Este navegador no permite usar la cámara. Abre el archivo con Chrome o Edge, o usa «Subir foto».';done&&done();return}
  const tries=deviceId?[{video:{deviceId:{exact:deviceId}},audio:false}]:[{video:{...(IS_MOBILE?{facingMode:{ideal:'environment'}}:{}),width:{ideal:1280},height:{ideal:960}},audio:false},{video:true,audio:false}];
  let last=null;
  for(const c of tries){try{this.stream=await navigator.mediaDevices.getUserMedia(c);last=null;break}catch(e){last=e;if(e.name==='NotAllowedError'||e.name==='NotFoundError')break}}
  if(last){const n=last.name;
    this.err=n==='NotAllowedError'?'Permiso de cámara denegado. Haz clic en el candado de la barra de direcciones → Cámara → Permitir, y pulsa «Reintentar cámara».':
      n==='NotFoundError'?'No se encontró ninguna cámara conectada.':
      n==='NotReadableError'?'La cámara está siendo usada por otro programa o pestaña (por ejemplo MS Shift). Ciérralo y pulsa «Reintentar cámara».':'No se pudo abrir la cámara ('+n+').';
    done&&done();return}
  if(!video||!video.isConnected){done&&done();return}
  video.srcObject=this.stream;await video.play().catch(()=>{});
  try{const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'),cur=this.stream.getVideoTracks()[0].getSettings().deviceId;
    if(sel){sel.innerHTML=devs.map((d,i)=>`<option value="${esc(d.deviceId)}" ${d.deviceId===cur?'selected':''}>${esc(d.label||'Cámara '+(i+1))}</option>`).join('');sel.style.display=devs.length>1?'block':'none'}}catch{}
  done&&done();
 },
 grab(video){
  if(!video||!video.videoWidth)return null;
  return cropTo(video,video.videoWidth,video.videoHeight);
 }};
function cropTo(el,w,h){const W=640,H=480,c=document.createElement('canvas');c.width=W;c.height=H;
  const vr=w/h,tr=W/H;let sw=w,sh=h,sx=0,sy=0;if(vr>tr){sw=h*tr;sx=(w-sw)/2}else{sh=w/tr;sy=(h-sh)/2}
  c.getContext('2d').drawImage(el,sx,sy,sw,sh,0,0,W,H);return c.toDataURL('image/jpeg',.85)}
function fileToPhoto(file){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{res(cropTo(im,im.naturalWidth,im.naturalHeight));URL.revokeObjectURL(im.src)};im.onerror=rej;im.src=URL.createObjectURL(file)})}
function stopCam(){Cam.stop()}
function startCam(id){Cam.start($('#cam'),$('#camSel'),paintPhoto,id)}
function snap(){const d=Cam.grab($('#cam'));if(d){S.foto=d;paintPhoto()}}
function paintPhoto(){
  const v=$('#cam'),i=$('#shot'),m=$('#pmsg');if(!v)return;
  const snapB=$('#btnSnap'),re=$('#btnRetake');
  const pb=v.parentElement;pb.classList.toggle('taken',!!S.foto);i.style.display='none';
  if(S.foto){v.style.display='none';snapB.style.display='none';re.style.display='inline-flex';m.textContent='Foto tomada ✓'}
  else{v.style.display=Cam.stream?'block':'none';snapB.style.display='inline-flex';snapB.disabled=!Cam.stream;re.style.display='none';
    m.textContent=Cam.err||(Cam.stream?'Cámara activa':'Activando cámara…')}
}

async function submitNew(e){
  e.preventDefault();const f=e.target;
  {const bm=blockedMatch(f.doc.value,f.nombre.value,f.apellido.value);if(bm&&await alertaBloq(bm))return}
  if(f.docTipo.value==='RUT'&&!validRut(f.doc.value)&&!confirm('El RUT ingresado no parece válido. ¿Registrar de todos modos?'))return;
  if(!S.foto&&!confirm('No se ha tomado foto. ¿Registrar sin foto?'))return;
  const dup=S.records.find(r=>!r.salida&&normDoc(r.doc)===normDoc(f.doc.value));
  if(dup&&!confirm('Esta persona ya figura dentro del recinto. ¿Registrar un nuevo ingreso igualmente?'))return;
  const ev=S.events.find(x=>String(x.id)===f.evento.value);
  const rec={tipo:f.tipo.value,docTipo:f.docTipo.value,doc:f.docTipo.value==='RUT'?fmtRut(f.doc.value.trim()):f.doc.value.trim(),
    nombre:f.nombre.value.trim(),apellido:f.apellido.value.trim(),empresa:f.empresa.value.trim(),patente:fmtPlate(f.patente.value),telefono:f.telefono.value.trim(),

function filterRecords(f){
  const c=s=>String(s||'').toLowerCase();
  return S.records.filter(r=>{
    if(f.doc&&!normDoc(r.doc).includes(normDoc(f.doc)))return false;
    if(f.nombre&&!c(r.nombre).includes(c(f.nombre)))return false;
    if(f.apellido&&!c(r.apellido).includes(c(f.apellido)))return false;
    if(f.empresa&&!c(r.empresa).includes(c(f.empresa)))return false;
    if(f.patente&&!r.patente.includes(normPlate(f.patente)))return false;
    if(f.evento==='none'&&r.eventoId!=null)return false;
    if(f.evento&&f.evento!=='none'&&String(r.eventoId)!==f.evento)return false;
    if(f.tipo&&r.tipo!==f.tipo)return false;
    if(f.estado==='dentro'&&r.salida)return false;
    if(f.estado==='salio'&&!r.salida)return false;
    const t=new Date(r.entrada);
    if(f.desde&&t<new Date(f.desde+'T00:00:00'))return false;
    if(f.hasta&&t>new Date(f.hasta+'T23:59:59.999'))return false;
    return true}).sort(byDesc);
}

let _ac,_errT,_errQ;
function beep(k){try{_ac=_ac||new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();
  const T={in:[[880,0,.09],[1320,.1,.15]],out:[[1000,0,.09],[660,.1,.17]],err:[[196,0,.22]],block:[[320,0,.2],[320,.26,.2],[320,.52,.35]]}[k],t0=_ac.currentTime,v=k==='err'?.035:k==='block'?.12:.18;
  T.forEach(([f,d,l])=>{const o=_ac.createOscillator(),g=_ac.createGain();o.type=k==='err'?'triangle':k==='block'?'sawtooth':'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(v,t0+d+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+d+l);o.connect(g).connect(_ac.destination);o.start(t0+d);o.stop(t0+d+l+.03)})}catch(e){}}
function errBeep(q,get){clearTimeout(_errT);_errT=setTimeout(()=>{if(get()===q&&_errQ!==q){_errQ=q;beep('err')}},450)}
function crossSearch(q){
  const toks=sn(q).split(/\s+/).filter(Boolean),d=normDoc(q),pl=normPlate(q),dOk=/\d/.test(q)&&d.length>=3,pOk=pl.length>=3;
  const hit=(h,doc,pt)=>toks.every(t=>h.includes(t))||(dOk&&doc&&normDoc(doc).includes(d))||(pOk&&pt&&normPlate(pt).includes(pl));
  const sp=S.people.filter(p=>hit(sn(`${p.apellido} ${p.ap2} ${p.nombre} ${p.area} ${p.cargo}`),p.rut,'')),
        sr=new Set(S.records.filter(r=>hit(sn(`${r.apellido} ${r.nombre} ${r.empresa} ${r.tarjeta}`),r.doc,r.patente)));
  const keys=new Set([...sp.map(p=>p.key),...[...sr].map(r=>r.personKey).filter(Boolean)]);
  const docs=new Set([...sp.map(p=>normDoc(p.rut)),...[...sr].map(r=>normDoc(r.doc))].filter(Boolean));
  return{people:S.people.filter(p=>keys.has(p.key)||(p.rut&&docs.has(normDoc(p.rut)))),
         recs:S.records.filter(r=>sr.has(r)||keys.has(r.personKey)||(r.doc&&docs.has(normDoc(r.doc))))};
}

function csv(list){

  const rows=list.map(r=>[fmtD(r.entrada),fmtT(r.entrada),r.salida?fmtD(r.salida):'',r.salida?fmtT(r.salida):'',r.salida?dur(r.entrada,r.salida):'En recinto',r.tipo,r.docTipo,r.doc,r.apellido,r.nombre,r.empresa,r.cargo||'',r.patente,r.tarjeta,r.eventoNombre,r.destino,r.obs,r.operador,r.operadorSalida]);
  return '﻿sep=;\r\n'+[head,...rows].map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
}

/* ============ eventos (gráfico) ============ */
const TCOL={coffee:'Coffee / break',almuerzo:'Almuerzo',reunion:'Reunión',cocktail:'Cocktail / cena',staff:'Staff',oficina:'Oficina staff',otro:'Otro'};
const toMin=s=>{const m=/(\d{1,2}):(\d{2})/.exec(s||'');return m?+m[1]*60+ +m[2]:null};
const H0=6,H1=23;
function timeline(e){
  const items=(e.sched||[]).map(x=>({f:x[0],s:x[1],a:toMin(x[2]),b:toMin(x[3]),pax:x[4],t:x[5],apx:!!x[6]})).filter(x=>x.a!=null&&x.b!=null);
  if(!items.length)return '<div class="empty">Este evento no tiene programa horario cargado.</div>';
  const groups=[];items.forEach(i=>{let g=groups.find(g=>g.n===i.s);if(!g){g={n:i.s,items:[]};groups.push(g)}g.items.push(i)});
  const span=(H1-H0)*60,pos=m=>Math.max(0,Math.min(100,(m-H0*60)/span*100));
  const rows=groups.map(g=>{
    g.items.sort((x,y)=>x.a-y.a);const ends=[];
    g.items.forEach(i=>{let k=ends.findIndex(en=>en<=i.a);if(k<0){k=ends.length;ends.push(0)}ends[k]=i.b;i.lane=k});
    const lanes=ends.length;
    g.items.forEach(i=>{const nx=g.items.filter(o=>o!==i&&o.lane===i.lane&&o.a>=i.b).sort((x,y)=>x.a-y.a)[0];i.maxw=nx?Math.max(0,pos(nx.a)-pos(i.b)):null});
    return `<div class="tlrow"><div class="lb">${esc(g.n)}</div><div class="lane" style="height:${lanes*30+8}px">${g.items.map(i=>{
      const l=pos(i.a),w=Math.max(1.2,pos(i.b)-l),hh=n=>`${pad(Math.floor(n/60))}:${pad(n%60)}`;
      const narrow=w<9,tip=`${esc(i.f)} · ${esc(i.s)} · ${hh(i.a)}–${hh(i.b)}${i.pax?` · ${i.pax} pax`:''}${i.apx?' · duración estimada':''}`,txt=`${i.apx?'~ ':''}${esc(i.f)}${i.pax?` · ${i.pax}`:''}`;
      return `<div class="bar ${i.t}" style="left:${l}%;width:${w}%;top:${4+i.lane*30}px;${i.apx?'outline:1px dashed rgba(0,0,0,.45);outline-offset:-3px;':''}" title="${tip}">${narrow?'':txt}</div>${narrow?`<div class="blab" style="left:calc(${l+w}% + 5px);top:${4+i.lane*30}px;${i.maxw!=null?`max-width:calc(${i.maxw}% - 8px);overflow:hidden;text-overflow:ellipsis;`:''}" title="${tip}">${txt}</div>`:''}`}).join('')}</div></div>`}).join('');
  const hrs=Array.from({length:H1-H0+1},(_,k)=>`<span style="left:${k/(H1-H0)*100}%">${pad(H0+k)}:00</span>`).join('');
  const d=new Date(),isToday=e.fecha&&fmtD(e.fecha+'T00:00:00')===fmtD(d),nm=d.getHours()*60+d.getMinutes();
  const now=isToday&&nm>=H0*60&&nm<=H1*60?`<div style="position:absolute;left:170px;right:0;top:24px;bottom:0;pointer-events:none"><div class="nowl" style="left:${pos(nm)}%"></div></div>`:'';
  const used=[...new Set(items.map(i=>i.t))];
  return `<div class="tl"><div class="tlin"><div class="tlax"><div></div><div class="hrs">${hrs}</div></div>${rows}${now}</div></div>
   <div class="legend">${used.map(t=>`<span><i class="bar ${t}" style="position:static;display:inline-block;width:11px;height:11px;padding:0;box-shadow:none"></i>${TCOL[t]}</span>`).join('')}</div>`;
}

  const day=new Date().getDate(),aut=e.seedKey?S.people.filter(p=>p.grp==='evt'&&p.evento&&e.seedKey.startsWith(p.evento)&&(p.dias||[]).includes(day)).length:0;

   <div class="evinfo">${info('Responsable cliente',[e.responsable,e.email].filter(Boolean).join(' · '))}${info('Encargada hotel',[e.encargada,e.encEmail].filter(Boolean).join(' · '))}${info('Estacionamiento',e.parking)}${info('Flores',e.flores)}</div>

   <div class="row no-print" style="margin-top:14px">${hasPeople?`<button class="btn gold sm" data-evp="${e.id}">Ver personal del evento</button>`:''}

}

  $('#empF').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let aoa;if(/\.(xlsx|xls)$/i.test(f.name)){const X=await loadXlsx(),wb=X.read(await f.arrayBuffer(),{type:'array'});aoa=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}else aoa=csvRows((await f.text()).replace(/^\uFEFF/,''));
    const h=aoa[0]||[],ci=Math.max(0,h.findIndex(c=>/empresa|proveedor|razon/.test(sn(String(c))))),skip=h.some(c=>/empresa|proveedor|razon|nombre/.test(sn(String(c))))?1:0,add=aoa.slice(skip).map(r=>String(r[ci]||'').trim()).filter(Boolean);
    await dbPut('settings',{key:'empresas',value:lines([...lines($('#cfgEmp').value),...add].join('\n'))});await loadAll();vConfig();toast(`${add.length} empresa(s) cargadas`)}catch(err){toast('No se pudo leer el archivo')}};
  $('#saveOp').onclick=async()=>{await dbPut('settings',{key:'operador',value:$('#op').value.trim()});await loadAll();clock();toast('Guardado')};
  $('#rmLogo').onclick=async()=>{await dbPut('settings',{key:'logo',value:null});await loadAll();toast('Logo quitado')};
  $('#logoF').onchange=e=>{const file=e.target.files[0];if(!file)return;const im=new Image();im.onload=async()=>{const h=Math.min(400,im.height),w=Math.round(im.width*h/im.height),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);await dbPut('settings',{key:'logo',value:c.toDataURL('image/png')});await loadAll();toast('Logo actualizado')};im.src=URL.createObjectURL(file)};
  $('#bk').onclick=()=>download(`respaldo_garita_${fmtD(new Date())}.json`,JSON.stringify({v:2,records:S.records,events:S.events,people:S.people,cfg:S.cfg}),'application/json');
  $('#rs').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.records))throw 0;
    if(!confirm(`Se reemplazarán los datos actuales por el respaldo (${d.records.length} registros). ¿Continuar?`))return;
    await dbClear('records');await dbClear('events');for(const r of d.records)await dbPut('records',r);for(const x of d.events||[])await dbPut('events',x);if(d.people){await dbClear('people');for(const x of d.people)await dbPut('people',x)}
    await loadAll();toast('Respaldo restaurado');vConfig()}catch{alert('El archivo no es un respaldo válido.')}};
}

/* ============ inicio ============ */
(async()=>{
  $('#introImg').src=LOGO_DEF;setTimeout(()=>{const i=$('#intro');i&&i.remove()},1800);
  try{db=await openDB();await loadAll();await seedData();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}}
  catch(e){$('#main').innerHTML='<div class="card"><h3>No se pudo iniciar</h3><p>Este navegador no permite guardar datos locales desde este archivo. Abre el archivo con Microsoft Edge o Google Chrome.</p></div>';return}
  clock();render();$('#bSave').onclick=openGuardar;const lb=$('#logoBox');lb.style.cursor='pointer';lb.title='Ir al menú principal';lb.onclick=()=>{S.pOpen=null;go('personal');playIntro()};$('#mLogo').onclick=lb.onclick;$('#mSaveTop').onclick=openGuardar;$('#mInst').onclick=()=>{if(window._inst){window._inst.prompt();window._inst=null;$('#mInst').style.display='none'}};if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});$('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-mdel]');if(b)delRec(+b.dataset.mdel)});
  setInterval(()=>$$('.pbox').forEach(b=>{const im=b.querySelector('img');b.classList.toggle('live',!!Cam.stream&&!b.classList.contains('taken'))}),300);
  window.addEventListener('beforeunload',()=>Cam.kill());
  if(!IS_MOBILE)Cam.start(null,null,null);setInterval(()=>{if(!Cam.stream||!Cam.stream.active)Cam.stream=null;const d=$('#camDot');if(d)d.style.display=Cam.stream?'flex':'none'},700);
  S_updateSaveInfo();snapImport();
})();
</script>
